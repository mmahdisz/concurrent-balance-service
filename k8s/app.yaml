apiVersion: v1
kind: Service
metadata:
  name: app
spec:
  selector:
    app: balance-app
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: balance-app
  template:
    metadata:
      labels:
        app: balance-app
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: wait-for-postgres
          image: postgres:17-alpine
          imagePullPolicy: IfNotPresent
          command: [sh, -ec, 'until pg_isready -h postgres -U balance -d balance; do sleep 2; done']
          resources:
            requests: {cpu: 25m, memory: 32Mi}
            limits: {cpu: 250m, memory: 128Mi}
        - name: wait-for-kafka
          image: apache/kafka:4.0.2
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -ec
            - until /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:19092 --list; do sleep 5; done
          env:
            - name: KAFKA_HEAP_OPTS
              value: -Xms64m -Xmx128m
          resources:
            requests: {cpu: 100m, memory: 192Mi}
            limits: {cpu: '1', memory: 384Mi}
      containers:
        - name: app
          image: concurrent-balance-service:local
          # The image must be built and loaded onto the cluster nodes first.
          imagePullPolicy: Never
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: balance-config
          env:
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: POSTGRES_PASSWORD
          resources:
            requests: {cpu: 250m, memory: 384Mi}
            limits: {cpu: '2', memory: 768Mi}
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 36
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            medium: Memory
            sizeLimit: 64Mi
