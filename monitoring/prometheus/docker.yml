global:
  scrape_interval: 15s
  evaluation_interval: 15s
scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: [localhost:9090]
  - job_name: balance-app
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: [app:8080]
  - job_name: cadvisor
    static_configs:
      - targets: [cadvisor:8080]
    metric_relabel_configs:
      # Scope container observations to this Compose project. Adjust when using -p.
      - source_labels: [container_label_com_docker_compose_project]
        regex: concurrent-balance-service
        action: keep
      - source_labels: [container_label_com_docker_compose_service]
        target_label: service
