apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - prometheus.yaml
  - grafana.yaml
  - kube-state-metrics.yaml
configMapGenerator:
  - name: prometheus-config
    files:
      - prometheus.yml=prometheus/kubernetes.yml
  - name: grafana-datasources
    files:
      - balance.yml=grafana/datasources.yml
  - name: grafana-providers
    files:
      - balance.yml=grafana/dashboards.yml
  - name: grafana-dashboard
    files:
      - balance-lab.json=grafana/balance-lab.json
